# Local stack.
#   docker compose up -d                  → Postgres + RabbitMQ (what `./mvnw spring-boot:run` needs)
#   docker compose --profile app up -d    → everything, backend behind Traefik on http://localhost
name: lyricsync

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lyricsync
      POSTGRES_USER: lyricsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # another project on 5432? set POSTGRES_PORT in .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyricsync -d lyricsync"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lyricsync
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  traefik:
    image: traefik:v3.7.17
    profiles: [app]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true        # dashboard on :8090, local only
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "127.0.0.1:8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backend:
    # the image CI publishes; `docker compose --profile app build backend` builds it locally instead
    image: ghcr.io/anasha447/lyricsync-backend:${BACKEND_TAG:-main}
    build: ./backend
    profiles: [app]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lyricsync
      DB_USER: lyricsync
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      AUDIO_STORAGE_ROOT: /data/audio
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost/media}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-lyricsync-audio}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - audio_data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.backend.rule: PathPrefix(`/api`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/media`)
      traefik.http.routers.backend.entrypoints: web
      traefik.http.routers.backend.middlewares: api-ratelimit
      traefik.http.middlewares.api-ratelimit.ratelimit.average: "20"
      traefik.http.middlewares.api-ratelimit.ratelimit.burst: "40"
      traefik.http.services.backend.loadbalancer.server.port: "8080"

  nlp:
    # the image CI publishes; `docker compose --profile app build nlp` builds it locally instead
    image: ghcr.io/anasha447/lyricsync-nlp:${NLP_TAG:-main}
    build: ./nlp-service
    profiles: [app]
    # internal only: no Traefik route. Published on localhost for its /docs while developing.
    ports:
      - "127.0.0.1:${NLP_PORT:-8001}:8000"

volumes:
  postgres_data:
  rabbitmq_data:
  audio_data:
