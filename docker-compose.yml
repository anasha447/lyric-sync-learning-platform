services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content_ingestion
      POSTGRES_USER: content_ingestion
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: