version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      spring:
        patterns: ["org.springframework*"]
      testing:
        patterns: ["org.testcontainers*", "org.junit*", "org.mockito*", "com.tngtech.archunit*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    ignore:
      # the project stays on Java 21 (LTS); only take patches of the 21 images
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
