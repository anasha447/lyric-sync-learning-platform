spring:
  application:
    name: content-ingestion
  datasource:
    url: jdbc:postgresql://localhost:5432/content_ingestion
    username: content_ingestion
    password: local_dev_only
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

app:
  storage:
    audio-root: ${AUDIO_STORAGE_ROOT:./data/audio}