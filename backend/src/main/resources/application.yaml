spring:
  application:
    name: lyricsync-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/content_ingestion
    username: content_ingestion
    password: local_dev_only
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    audio-root: ${AUDIO_STORAGE_ROOT:./data/audio}
