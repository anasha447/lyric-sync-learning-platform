spring:
  application:
    name: lyricsync-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lyricsync}
    username: ${DB_USER:lyricsync}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  docker:
    compose:
      # `./mvnw spring-boot:run` starts Postgres and RabbitMQ from the root compose file
      file: ../compose.yaml
  cache:
    # fixed names: a typo in a @Cacheable fails at startup instead of quietly creating a new cache
    cache-names: publishedSongs, publishedSongPages
    caffeine:
      # recordStats feeds cache_gets_total{result="hit|miss"} to Prometheus
      spec: maximumSize=500,expireAfterWrite=10m,recordStats

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    # local: files on disk, served by the backend under /media; r2: Cloudflare R2 (production)
    type: ${STORAGE_TYPE:local}
    audio-root: ${AUDIO_STORAGE_ROOT:./data/audio}
    # where browsers fetch audio from: /media locally, the R2 bucket's public domain in production
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost/media}
    r2:
      endpoint: ${R2_ENDPOINT:}                    # https://<account id>.r2.cloudflarestorage.com
      bucket: ${R2_BUCKET:lyricsync-audio}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
